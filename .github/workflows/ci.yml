name: CI

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve package
        run: swift package resolve

      - name: Test
        run: swift test --parallel

      - name: Release build
        run: swift build --configuration release -Xswiftc -warnings-as-errors

      - name: Build Universal 2 local app bundle
        env:
          UMIS_ALLOW_ADHOC: "1"
          UMIS_UNIVERSAL2: "1"
        run: Scripts/build_app.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 "dist/RINKAN UMIS.app"
